<form #threadForm="ngForm">
    <div class="row">
      <div class="col-lg-12">
        <div class="form-wrapper">
          <div class="stiky_header stiky_header_65">
            <div class="form-head">
              <div class="form-head-label">
                <h3 class="form-head-title">
                  {{ pageTitle }}
                </h3>
              </div>
              <div class="form-head-toolbar">
                <!-- <a href="javascript:;" class="btn btn-clean" (click)="back()">
                  <i class="fas fa-arrow-left"></i>
                  <span class="hidden-mobile">Back</span>
                </a> -->
                <div *ngIf="!viewOnlyStatus" class="btn-group">
                  <button type="button" class="btn btn-primary" (click)="save(threadForm)">
                    <i class="fas fa-check"></i>
                    <span class="hidden-mobile">Save</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="form-body">
            <widet-template [widget_config]="templateData" [widget_model]="dataModel" [form]="threadForm"></widet-template>
          </div>
        </div>
      </div>
    </div>
  </form>
