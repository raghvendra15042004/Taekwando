<div class="header stiky_header">
  <nav class="navbar navbar-expand-lg navbar-light bg-white">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo03"
      aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-brand">
      <div class="brand-logo">
        <a href="#">
          <h2>Tab Fest</h2>
          <!-- <img src="./assets/images/logo.png" class="logo-img" alt=""> -->
        </a>
      </div>
    </div>

    <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
      <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
        <li *ngFor="let item of menuItems['items']" class="nav-item" [ngClass]="{'dropdown': item.submenu}">
          <ng-container *ngIf="item.submenu">
            <a class="nav-link font-weight-bold dropdown-toggle" href="javascript:;">{{item.title}}</a>
            <ul class="dropdown-menu">
              <li class="dropdown-item" *ngFor="let subMenuItem of item.submenu">
                <a [routerLink]="[subMenuItem.page]" (click)="loadModule(subMenuItem.page)" routerLinkActive="active" class="nav-link font-weight-bold">{{subMenuItem.title}}</a>
              </li>
            </ul>
          </ng-container>
          <ng-container *ngIf="!item.submenu">
            <a [routerLink]="[item.page]" (click)="loadModule(item.page)" routerLinkActive="active"
              class="nav-link font-weight-bold">{{item.title}}</a>
          </ng-container>
        </li>
      </ul>
      <div class="login-user">
        <div class="login-user-label">Super Admin</div>
        <a class="nav-link font-weight-bold" href="javascript:;" (click)="signOut()"><i
            class="fas fa-sign-out-alt"></i></a>
      </div>
    </div>
  </nav>
</div>
