<div class="tab-group">
  <div class="tab-body-wrapper">
    <div class="tab-body">
      <div class="tab-body-content">
        <ng-container *ngIf="tab_config">
          <ng-container *ngFor="let tab of tab_config.tabs; let tabIndex = index">
            <div class="row">
              <div class="col-lg-12">
                <div class="form-panel">
                  <div class="panel-head">
                    <div class="panel-head-label">
                      <h3 class="panel-head-title">{{tab.text}}</h3>
                    </div>
                  </div>
                  <div class="panel-body">
                    <div class="form-group row">
                      <ng-container *ngFor="let field of tab.fields, let fieldIndex = index">
                        <div class="col-lg-12 col-form-label" [hidden]="field.hidden">
                          <div class="form-group row">
                            <div class="col-lg-3 col-form-label">
                              <app-label [label]="field"></app-label>
                            </div>
                            <div class="col-lg-9">
                              <!-- <div class="input-group">
                                <input type="text" name="productName" class="form-control" placeholder="Product Name">
                              </div> -->
                              <runtime-widget 
                                [Field]="field" 
                                [fieldModel]="tab_model"
                                [formConfig]="tab_config"
                                [form]="form"
                                ></runtime-widget>
                            </div>
                          </div>
                        </div>
                      </ng-container>
