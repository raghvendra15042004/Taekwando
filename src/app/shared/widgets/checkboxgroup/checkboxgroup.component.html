<div class="d-flex justify-content-end">
    <div class="form-control multi-radio-group">
        <div class="radio-inline" [ngClass]="{'cursor-not-allowed' : Field.disabled == true}">
            <ng-container>
                <div class="form-check form-check-inline" *ngFor="let checkboxControl of Field.children">
                    <input 
                        type="checkbox" 
                        [id]="checkboxControl.name" 
                        class="form-check-input" 
                        [name]="Field.name"
                        (change)="changeCheckBox($event, checkboxControl.name, checkboxControl.text)"
                        [checked]="checkboxControl.checked">
                    <label class="form-check-label">{{checkboxControl.text}}</label>
                </div>
            </ng-container>
        </div>
    </div>
</div>
