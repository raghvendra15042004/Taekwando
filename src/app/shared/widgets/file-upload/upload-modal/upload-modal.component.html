<div class="modal-header">
  <h4 class="modal-title" id="modal-title">{{ headerText }}</h4>
  <button type="button" class="close" aria-label="Close button" aria-describedby="modal-title"
    (click)="activeModal.close()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body">
  <div class="form-group row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="dropzone dropzone-default dropzone-primary dz-clickable" id="kt_dropzone_2">
        <ng-container *ngIf="!fieldConfig.multiUpload">
          <input #myInputFile type="file" class="file_upload" [(ngModel)]="fileModel" (change)="inputFile($event)" />
        </ng-container>
        <ng-container *ngIf="fieldConfig.multiUpload">
          <input #myInputFile type="file" class="file_upload" [(ngModel)]="fileModel" (change)="inputFile($event)" multiple />
        </ng-container>

        <div class="dropzone-msg dz-message needsclick">
          <h3 class="dropzone-msg-title">Click to upload.</h3>
          <span class="dropzone-msg-desc">Supported Files ( {{ fileType | uppercase }} )</span>
        </div>
      </div>
      <div class="col-lg-12 col-md-12 col-sm-12 mt-3">
        <span class="form-text text-danger text-center" style="font-size: 16px;" *ngIf="uploadFileValidationStatus">
          {{ uploadFileValidationMessage }}
        </span>
      </div>
    </div>
  </div>
  <div class="table-responsive mt-5" *ngIf="isFileUploaded">
    <table class="table table-fixed">
      <thead>
        <tr>
          <th scope="col" style="width: 5%;">#</th>
          <th scope="col" style="width: 7%;" *ngIf="fileDetails.thumbUrl != ''">File</th>
          <th scope="col" style="width: 20%;">File Name</th>
          <th scope="col" style="width: 20%;">FIle Size</th>
          <!-- <th scope="col" style="width: 30%;">Description (File alt text)</th> -->
          <th scope="col" style="width: 8%;"></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th style="vertical-align: middle;">1</th>
          <td style="align-items: center;" *ngIf="fileDetails.thumbUrl != ''">
            <img class="img-fluid rounded mx-auto" [src]="fileDetails.thumbUrl" />
          </td>
          <td style="vertical-align: middle;">{{ fileDetails.fileName }}</td>
          <td style="vertical-align: middle;">{{ fileDetails.fileSize | number :'1.0-0'}} KB</td>
          <!-- <td>
                  <textarea type="text" class="form-control" rows="3"></textarea>
                </td> -->
          <td style="vertical-align: middle;">
            <div class="d-flex justify-content-between p-2 upload-action">
              <span (click)="clearFileDetails()"><i class="fas fa-trash"></i></span>

              <!-- <a [href]="fileDetails.fileUrl" target="_blank"><i class="fas fa-eye"></i></a> -->
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.close()">Cancel</button>
  <button type="button" class="btn btn-success" [disabled]="(fileDetails | json) == '{}'" (click)="saveUploadFile()">
    Save & Continue
  </button>
</div>
